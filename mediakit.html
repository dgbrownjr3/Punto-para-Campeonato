<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Kit & Propuesta de Patrocinio 2027 — Punto Para Campeonato (PPCTT)</title>
  <meta name="description" content="Media Kit oficial y propuesta de patrocinio 2027 de Punto Para Campeonato (PPCTT). Conectamos marcas líderes con más de 60,000 federados y 150,000 jugadores de tenis de mesa en América." />
  <link rel="icon" type="image/png" href="/logo.png" />
  <style>
    :root {
      --bg: #070d19;
      --surface: #111b2e;
      --surface-alt: #16233b;
      --border: rgba(255, 255, 255, 0.09);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --gold: #f59e0b;
      --gold-soft: rgba(245, 158, 11, 0.14);
      --green: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.62;
      padding-bottom: 4rem;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(7, 13, 25, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--text);
      font-weight: 700;
      font-size: 1.05rem;
    }

    .brand img {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      object-fit: cover;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-pdf {
      background: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.42rem 0.85rem;
      border-radius: 9px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .btn-pdf:hover {
      border-color: var(--accent);
    }

    .lang-switcher {
      display: flex;
      gap: 0.3rem;
      background: var(--surface);
      padding: 0.25rem;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.8rem;
      padding: 0.35rem 0.6rem;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn.active {
      background: var(--accent);
      color: #04101f;
    }

    /* Main */
    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 2rem 1.25rem 0;
    }

    /* Hero */
    .hero {
      background: radial-gradient(circle at top right, rgba(56, 189, 248, 0.15), transparent 55%),
                  linear-gradient(135deg, var(--surface) 0%, #0b1324 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.35rem 2rem;
      margin-bottom: 1.75rem;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .badge {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
    }

    .badge.gold {
      background: var(--gold-soft);
      color: var(--gold);
    }

    .hero h1 {
      font-size: clamp(1.75rem, 3.6vw, 2.45rem);
      line-height: 1.22;
      margin-bottom: 0.9rem;
      color: #ffffff;
    }

    .hero p {
      color: #cbd5e1;
      max-width: 820px;
      font-size: 1.03rem;
      margin-bottom: 1.5rem;
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
    }

    .btn-primary {
      display: inline-block;
      background: var(--accent);
      color: #04101f;
      font-weight: 700;
      font-size: 0.92rem;
      padding: 0.7rem 1.35rem;
      border-radius: 11px;
      transition: opacity 0.2s;
    }

    .btn-primary:hover {
      opacity: 0.92;
      text-decoration: none;
    }

    .btn-secondary {
      display: inline-block;
      background: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.92rem;
      padding: 0.7rem 1.35rem;
      border-radius: 11px;
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      text-decoration: none;
    }

    /* KPI Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
