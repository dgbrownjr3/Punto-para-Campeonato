<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Kit & Propuesta de Patrocinio 2027 — Punto Para Campeonato (PPCTT)</title>
  <meta name="description" content="Media Kit oficial y propuesta de patrocinio 2027 de Punto Para Campeonato (PPCTT). Conectamos marcas líderes con más de 60,000 atletas federados de tenis de mesa en América." />
  <link rel="icon" type="image/png" href="/logo.png" />
  <style>
    :root {
      --bg: #070d19;
      --surface: #111b2e;
      --surface-alt: #16233b;
      --border: rgba(255, 255, 255, 0.09);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --gold: #f59e0b;
      --gold-soft: rgba(245, 158, 11, 0.14);
      --green: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.62;
      padding-bottom: 4rem;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(7, 13, 25, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--text);
      font-weight: 700;
      font-size: 1.05rem;
    }

    .brand img {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      object-fit: cover;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-pdf {
      background: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.42rem 0.85rem;
      border-radius: 9px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .btn-pdf:hover {
      border-color: var(--accent);
    }

    .lang-switcher {
      display: flex;
      gap: 0.3rem;
      background: var(--surface);
      padding: 0.25rem;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.8rem;
      padding: 0.35rem 0.6rem;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn.active {
      background: var(--accent);
      color: #04101f;
    }

    /* Main */
    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 2rem 1.25rem 0;
    }

    /* Hero */
    .hero {
      background: radial-gradient(circle at top right, rgba(56, 189, 248, 0.15), transparent 55%),
                  linear-gradient(135deg, var(--surface) 0%, #0b1324 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.35rem 2rem;
      margin-bottom: 1.75rem;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .badge {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
    }

    .badge.gold {
      background: var(--gold-soft);
      color: var(--gold);
    }

    .hero h1 {
      font-size: clamp(1.75rem, 3.6vw, 2.45rem);
      line-height: 1.22;
      margin-bottom: 0.9rem;
      color: #ffffff;
    }

    .hero p {
      color: #cbd5e1;
      max-width: 820px;
      font-size: 1.03rem;
      margin-bottom: 1.5rem;
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
    }

    .btn-primary {
      display: inline-block;
      background: var(--accent);
      color: #04101f;
      font-weight: 700;
      font-size: 0.92rem;
      padding: 0.7rem 1.35rem;
      border-radius: 11px;
      transition: opacity 0.2s;
    }

    .btn-primary:hover {
      opacity: 0.92;
      text-decoration: none;
    }

    .btn-secondary {
      display: inline-block;
      background: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.92rem;
      padding: 0.7rem 1.35rem;
      border-radius: 11px;
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      text-decoration: none;
    }

    /* KPI Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 1.75rem;
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.35rem 1.25rem;
    }

    .kpi-value {
      font-size: 1.85rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1.15;
      margin-bottom: 0.35rem;
    }

    .kpi-card.highlight .kpi-value {
      color: var(--gold);
    }

    .kpi-label {
      font-size: 0.94rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.25rem;
    }

    .kpi-sub {
      font-size: 0.82rem;
      color: var(--muted);
    }

    /* Section */
    section.kit-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.85rem;
      margin-bottom: 1.5rem;
    }

    section.kit-section h2 {
      font-size: 1.35rem;
      margin-bottom: 0.85rem;
      color: #ffffff;
    }

    section.kit-section p {
      color: #cbd5e1;
      margin-bottom: 1rem;
    }

    .callout {
      background: rgba(56, 189, 248, 0.08);
      border-left: 3px solid var(--accent);
      padding: 0.95rem 1.15rem;
      border-radius: 0 12px 12px 0;
      margin-top: 0.75rem;
      font-size: 0.94rem;
      color: #e2e8f0;
    }

    /* Responsive Data Tables */
    .table-wrap {
      overflow-x: auto;
      margin-top: 0.85rem;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
      text-align: left;
    }

    th {
      background: var(--surface-alt);
      color: var(--accent);
      font-weight: 700;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      color: #cbd5e1;
      vertical-align: top;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr.total-row td {
      background: rgba(56, 189, 248, 0.08);
      color: #ffffff;
      font-weight: 700;
    }

    .badge-inline {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      white-space: nowrap;
    }

    .badge-inline.gold {
      background: var(--gold-soft);
      color: var(--gold);
    }

    /* Features Grid */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.1rem;
      margin-top: 0.85rem;
    }

    .feature-box {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem;
    }

    .feature-box h3 {
      font-size: 1.04rem;
      color: #ffffff;
      margin-bottom: 0.45rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .feature-box p {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 0;
    }

    /* Packages Grid */
    .packages-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
      margin-top: 1rem;
    }

    .pkg-card {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .pkg-card.featured {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.25);
    }

    .pkg-tag {
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin-bottom: 0.4rem;
    }

    .pkg-card.featured .pkg-tag {
      color: var(--gold);
    }

    .pkg-card h3 {
      font-size: 1.2rem;
      color: #ffffff;
      margin-bottom: 0.75rem;
    }

    .pkg-card ul {
      padding-left: 1.2rem;
      color: #cbd5e1;
      font-size: 0.9rem;
      margin-bottom: 1.35rem;
    }

    .pkg-card li {
      margin-bottom: 0.5rem;
    }

    /* Roadmap */
    .roadmap-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1rem;
      margin-top: 0.85rem;
    }

    .road-step {
      background: var(--surface-alt);
      border-left: 3px solid var(--accent);
      border-radius: 0 12px 12px 0;
      padding: 1.1rem 1.2rem;
    }

    .road-step.featured {
      border-left-color: var(--gold);
    }

    .road-date {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .road-step.featured .road-date {
      color: var(--gold);
    }

    .road-step h4 {
      font-size: 1rem;
      color: #ffffff;
      margin-bottom: 0.35rem;
    }

    .road-step p {
      font-size: 0.87rem;
      color: var(--muted);
      margin-bottom: 0;
    }

    /* Contact Box */
    .contact-banner {
      background: linear-gradient(135deg, #13223d 0%, #0d172a 100%);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 18px;
      padding: 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .contact-banner h2 {
      font-size: 1.4rem;
      margin-bottom: 0.4rem;
      color: #ffffff;
    }

    .contact-banner p {
      color: #cbd5e1;
      margin-bottom: 0;
      max-width: 560px;
    }

    .contact-details {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 0.94rem;
    }

    footer {
      max-width: 1080px;
      margin: 2.5rem auto 0;
      padding: 1.5rem 1.25rem 0;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .footer-links {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    /* Language visibility */
    [data-lang] {
      display: none;
    }

    body.lang-es [data-lang="es"],
    body.lang-en [data-lang="en"],
    body.lang-pt [data-lang="pt"] {
      display: block;
    }

    span[data-lang] {
      display: none;
    }

    body.lang-es span[data-lang="es"],
    body.lang-en span[data-lang="en"],
    body.lang-pt span[data-lang="pt"] {
      display: inline;
    }

    /* Print / PDF Export Styles */
    @media print {
      body {
        background: #ffffff;
        color: #0f172a;
        padding-bottom: 0;
      }
      header, .cta-row, footer, .pkg-card a {
        display: none !important;
      }
      .hero, .kpi-card, section.kit-section, .feature-box, .pkg-card, .road-step, .contact-banner {
        background: #f8fafc !important;
        color: #0f172a !important;
        border: 1px solid #cbd5e1 !important;
        box-shadow: none !important;
        break-inside: avoid;
      }
      .hero h1, section.kit-section h2, .kpi-label, .feature-box h3, .pkg-card h3, .road-step h4, .contact-banner h2 {
        color: #0f172a !important;
      }
      .hero p, section.kit-section p, td, .pkg-card ul, .contact-banner p {
        color: #334155 !important;
      }
      th {
        background: #e2e8f0 !important;
        color: #0f172a !important;
      }
      .kpi-value, .pkg-tag, .road-date {
        color: #0284c7 !important;
      }
    }
  </style>
</head>
<body class="lang-es">

  <header>
    <div class="nav-container">
      <a href="/" class="brand">
        <img src="/logo.png" alt="Punto Para Campeonato" />
        <span>Punto Para Campeonato</span>
      </a>
      <div class="nav-actions">
        <button class="btn-pdf" onclick="window.print()">
          <span data-lang="es">📄 Guardar PDF</span>
          <span data-lang="en">📄 Save PDF</span>
